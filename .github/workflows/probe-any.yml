name: Probe Any
on:
  workflow_run:
    workflows: ["CI3"]
    types: [completed]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: payload
        run: |
          jq -c '{event:.workflow_run.event,head_branch:.workflow_run.head_branch,head_sha:.workflow_run.head_sha,head_repo:.workflow_run.head_repository.full_name,fork:.workflow_run.head_repository.fork}' "$GITHUB_EVENT_PATH"
          echo "GITHUB_REF=$GITHUB_REF"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: |
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          if grep -q PWNED_START scripts/run-test.sh; then echo "ATTACKER_CODE_CHECKED_OUT=true"; else echo "ATTACKER_CODE_CHECKED_OUT=false"; fi
